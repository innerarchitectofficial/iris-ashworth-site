<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="완벽한 얼굴을 그만두는 법 — 등장인물 소개">
  <title>등장인물 — 완벽한 얼굴을 그만두는 법</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reading.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="world.css">
<link rel="stylesheet" href="serial-preview.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="top-logo"><a href="index.html" aria-label="메인으로 돌아가기"><img src="images/brand-logo.png" alt="Iris Ashworth" width="1983" height="793" decoding="async"></a></header>
  <nav class="site-nav" aria-label="주 메뉴"><a href="index.html">작품 소개</a><a href="contents.html">연재 목차</a><a href="characters.html" aria-current="page">등장인물</a><a href="world.html">세계관</a></nav>
  <main id="main">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">THE CHARACTERS</p>
      <h1 id="page-title">이야기를 살아가는 얼굴들</h1>
      <p class="intro-sub">한 사람의 얼굴 너머, 그 안에 담긴 이야기.<br>인물을 선택해 자세히 만나보세요.</p>
    </section>
    <div class="collection-tools" id="roster-tools" hidden><label for="character-search">인물 찾기</label><input id="character-search" type="search" placeholder="이름이나 역할로 찾아보세요" autocomplete="off"></div>
    <div class="characters" id="character-list" role="tablist" aria-label="등장인물 선택"></div>
    <button type="button" class="collection-more" id="roster-more" aria-controls="character-list" aria-expanded="false" hidden>인물 전체 보기</button>
    <p class="collection-empty" id="roster-empty" hidden>검색 결과가 없습니다. 다른 이름으로 찾아보세요.</p>
    <section class="detail" id="character-detail" role="tabpanel" tabindex="0" aria-labelledby="character-tab-0">
      <figure class="portrait-frame">
        <img class="portrait" id="portrait" alt="" width="1080" height="1920">
        <figcaption class="portrait-caption"><span id="portrait-label"></span><span id="portrait-note"></span></figcaption>
      </figure>
      <header class="detail-heading">
        <p class="detail-kicker" id="detail-kicker"></p>
        <h2 id="character-name"></h2>
        <p class="role" id="character-role"></p>
      </header>
      <div class="detail-copy">
        <p class="quote" id="character-quote"></p>
        <div class="bio" id="character-bio"></div>
        <div class="detail-footer"><span class="detail-count" id="detail-count"></span><button class="next" type="button">다음 인물<span aria-hidden="true">→</span></button></div>
      </div>
    </section>
    <p class="sr-only" id="selection-status" role="status" aria-live="polite"></p>
    <noscript><p>등장인물 선택 기능을 이용하려면 브라우저의 JavaScript를 켜주세요.</p></noscript>
    <div class="return"><a href="index.html">← 작품 소개로 돌아가기</a><a href="world.html">왕국의 세계관 살펴보기 →</a></div>
  </main>
  <footer>Published by Inner Architect</footer>
  <script>
    // 공개용 소개문. 모든 인물은 사용자가 제공한 최신 문안을 반영했습니다.
    // image/thumbnail에는 상대 경로나 이미지 URL을 입력합니다.
    // 인물을 더 추가하거나 삭제하면 원형 메뉴와 인원수가 자동으로 갱신됩니다.
    const characters = [
      {
        name:'아이리스 애시워스', englishName:'IRIS ASHWORTH',
        role:'애시워스 왕국의 공주이자 제1 왕위 계승자.',
        image:'images/iris-ashworth.jpg', imageSmall:'images/iris-ashworth-small.jpg', thumbnail:'images/iris-ashworth-thumb.jpg', thumbnailPosition:'50% 18%', imagePosition:'center',
        quote:'모두에게 필요한 사람이었지만,\n정작 자신이 원하는 삶은 묻지 않았던 공주.',
        paragraphs:[
          '영리하고 결단력 있는 아이리스는 왕국이 인정한 완벽한 후계자다. 왕실과 백성에 대한 책임을 성실히 다하며, 자신이 무엇을 원하는지보다 무엇을 해야 하는지를 먼저 생각한다.',
          '사랑받고 보호받으며 자라온 삶이었다. 아이리스 역시 그것이 자신을 위한 삶이라고 믿었다. 마음을 외면할수록 조여드는 사파이어 목걸이도, 목에 남는 상처와 가빠지는 숨도, 자신이 조금 더 견디면 되는 일이라고 여겼다.',
          '그러나 거울이 판정한 자신과 스스로 느끼는 감각이 어긋나기 시작하고, 낯선 만남들은 오랫동안 의심하지 않았던 믿음을 흔든다. 당연하게 받아들였던 미래에도 처음으로 의문이 생긴다.',
          '늘 다른 이들의 기대에 답해왔던 아이리스는 비로소 자신에게 묻기 시작한다.',
          '그 물음 끝에 왕관을 거절한 공주를,\n왕국은 마녀라 부른다.',
          '누군가를 사랑하고 지키면서도,\n자기 자신을 잃지 않을 수 있을까.'
        ], color:'#625344'
      },
      {
        name:'홀리스 베인', englishName:'HOLLIS VANE',
        role:'북부 베인가의 후계자이자, 북부를 대표해 왕국의 궁정에 온 사절.',
        image:'images/hollis-vane.jpg', imageSmall:'images/hollis-vane-small.jpg', thumbnail:'images/hollis-vane-thumb.jpg', thumbnailPosition:'50% 18%', imagePosition:'center',
        quote:'어디에도 붙잡히지 않으려 했지만,\n누군가의 곁에 머무는 일에는 서툴렀던 남자.',
        paragraphs:[
          '느긋하고 격의 없는 태도 속에 몸에 밴 예법과 날카로운 판단력을 지녔다. 궁정의 질서를 능숙하게 따르면서도, 그 질서에 맞추기 위해 사람의 삶을 고쳐 쓰라는 요구에는 순순히 응하지 않는다.',
          '우아한 귀족이자 자유로운 방랑자. 북부 사람들의 권리를 지키는 협상가이자 자신의 책임을 미뤄온 후계자. 서로 다른 모습이 모두 진실인 그를, 왕국의 거울은 하나의 얼굴로 정하지 못한다.',
          '아이리스의 완벽한 미소에 이끌린 그의 시선은 어느 순간 드레스 자락을 움켜쥔 손에 머문다. 그는 그녀를 쉽게 해석하지 않는다. 대답을 재촉하지 않고, 말하지 않은 마음을 그대로 남겨둔다. 그렇게 궁금했던 한 사람이 조금씩 소중해진다.',
          '그러나 타인의 선택을 존중하는 데 익숙한 그도, 정작 자신의 마음을 솔직히 말해야 할 때는 한발 물러선다.',
          '자유롭게 살아왔다고 믿었지만, 그 자유는 아버지가 가문과 북부의 책임을 짊어지고 있었기에 가능했다. 피할 수 없는 책임과 곁에 있고 싶은 사람 앞에서, 홀리스는 자신이 무엇을 지키고 싶은지 묻기 시작한다.',
          '자유를 잃지 않으면서도,\n누군가의 곁에 남을 수 있을까.'
        ], color:'#455463'
      },
      {
        name:'커런 노윅', englishName:'CURRAN NORWICK',
        role:'노윅가의 후계자이자, 아이리스 애시워스의 정혼자.',
        image:'images/curran-norwick.jpg', imageSmall:'images/curran-norwick-small.jpg', thumbnail:'images/curran-norwick-thumb.jpg', thumbnailPosition:'50% 28%', imagePosition:'center',
        quote:'그녀를 지킬 미래는 준비했지만,\n그녀가 원하는 미래는 묻지 않았던 남자.',
        paragraphs:[
          '단정하고 신중하며, 맡은 일에 좀처럼 빈틈을 남기지 않는다. 왕실의 행정과 기록을 다루는 커런은 법과 질서가 사람을 보호한다고 믿는다. 이름과 관계, 재산과 권리가 정확히 기록되어야 힘없는 사람도 자신의 삶을 지킬 수 있다고 생각한다.',
          '아이리스와 함께 자라며 쌓아온 신뢰와 애정은 진심이었다. 그녀가 왕위를 잇고 자신이 그 곁을 지키는 미래도 오래도록 당연했다. 커런은 그녀가 감당할 부담을 덜고, 위험을 미리 막으며, 두 사람의 삶이 흔들리지 않도록 준비해왔다.',
          '그러나 그녀가 느끼는 고통마저 자신이 이해하는 방식으로 설명하고, 낯선 선택을 위험으로 판단하는 동안, 아이리스가 무엇을 원하는지는 묻지 못했다. 그에게는 안전하게 지켜줄 미래가 분명했기에, 그녀가 그 미래를 원하지 않을 가능성은 쉽게 떠올릴 수 없었다.',
          '자신이 가장 잘 안다고 믿었던 사람에게서 이제껏 알지 못했던 표정을 발견한다. 함께 믿어온 삶에 아이리스가 의문을 품을수록, 커런은 더욱 빈틈없는 계획을 세우고 그녀를 둘러싼 위험과 변수를 하나씩 통제하려 한다.',
          '하지만 그가 마련한 안전과 그녀가 원하는 삶 사이의 거리는 조금씩 벌어진다. 언제나 옳은 답을 준비해온 커런에게도, 대신 답할 수 없는 물음이 남는다.',
          '사랑하는 사람을 지키기 위해,\n자신이 준비한 미래를 놓아줄 수 있을까.'
        ], color:'#554c43'
      }
    ];
    const twoDigits = number => String(number).padStart(2,'0');
    function placeholder(index) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750"><defs><radialGradient id="g" cx="50%" cy="32%" r="80%"><stop stop-color="${characters[index].color}"/><stop offset="1" stop-color="#15151d"/></radialGradient><linearGradient id="s" x2="0" y2="1"><stop stop-color="#c2b8a0" stop-opacity=".28"/><stop offset="1" stop-color="#c2b8a0" stop-opacity=".02"/></linearGradient></defs><path fill="url(#g)" d="M0 0h600v750H0z"/><rect x="58" y="54" width="484" height="642" rx="242" fill="none" stroke="#b08d45" stroke-opacity=".18"/><circle cx="300" cy="280" r="88" fill="url(#s)"/><path d="M116 625v-68c0-94 72-168 184-168s184 74 184 168v68Z" fill="url(#s)"/><path d="M260 655h80" stroke="#b08d45" stroke-opacity=".5"/><text x="300" y="697" text-anchor="middle" font-family="Georgia,serif" font-size="16" letter-spacing="5" fill="#c0aa7c">PORTRAIT ${twoDigits(index+1)}</text></svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    const tablist = document.querySelector('[role="tablist"]');
    const panel = document.querySelector('#character-detail');
    const portrait = document.querySelector('#portrait');
    let selected = 0;
    const tabs = characters.map((character,index) => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'character-tab'; button.id = `character-tab-${index}`;
      button.setAttribute('role','tab'); button.setAttribute('aria-controls','character-detail');
      const avatar = document.createElement('span'); avatar.className = 'avatar';
      const img = document.createElement('img'); img.alt = ''; img.width = 110; img.height = 110; img.decoding = 'async';
      img.src = character.thumbnail || character.image || placeholder(index); img.style.objectPosition = character.thumbnailPosition || character.imagePosition || 'center';
      img.addEventListener('error',() => { img.src = placeholder(index); },{once:true});
      avatar.append(img);
      const label = document.createElement('span'); label.className = 'tab-name'; label.textContent = character.name;
      button.append(avatar,label); button.addEventListener('click',() => selectCharacter(index));
      button.addEventListener('keydown',event => {
        const available=tabs.map((tab,i)=>!tab.hidden?i:-1).filter(i=>i>=0);
        const cursor=available.indexOf(index);
        let next;
        if(event.key === 'ArrowRight') next = available[(cursor+1)%available.length];
        else if(event.key === 'ArrowLeft') next = available[(cursor-1+available.length)%available.length];
        else if(event.key === 'Home') next = available[0];
        else if(event.key === 'End') next = available[available.length-1];
        else return;
        event.preventDefault(); selectCharacter(next); tabs[next].focus();
        tabs[next].scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
      });
      tablist.append(button); return button;
    });
    const search=document.querySelector('#character-search');
    // 미공개 자리는 실제 인물 수와 선택 순서에 포함하지 않습니다.
    const teaserTabs = Array.from({length:2}, (_,index) => {
      const button = document.createElement('button');
      button.type = 'button'; button.className = 'character-tab character-teaser';
      button.disabled = true; button.tabIndex = -1;
      button.setAttribute('role','tab'); button.setAttribute('aria-selected','false');
      button.setAttribute('aria-label',`미공개 인물 ${index+1} · 추후 공개 예정`);
      const avatar = document.createElement('span'); avatar.className = 'avatar mystery-avatar';
      avatar.setAttribute('aria-hidden','true'); avatar.textContent = '?';
      const label = document.createElement('span'); label.className = 'tab-name'; label.textContent = '공개 예정';
      button.append(avatar,label); tablist.append(button); return button;
    });
    const rosterMore=document.querySelector('#roster-more');
    let expanded=false;
    function matchingCharacters(){const query=search.value.trim().toLocaleLowerCase();return characters.map((c,i)=>`${c.name} ${c.englishName} ${c.role}`.toLocaleLowerCase().includes(query)?i:-1).filter(i=>i>=0);}
    function updateRoster(){
      const matches=matchingCharacters();
      if(matches.indexOf(selected)>=6)expanded=true;
      const showAll=expanded||Boolean(search.value.trim());
      tabs.forEach((tab,i)=>tab.hidden=!matches.includes(i)||(!showAll&&matches.indexOf(i)>=6));
      teaserTabs.forEach(tab=>tab.hidden=Boolean(search.value.trim())||(!showAll&&matches.length>6));
      rosterMore.hidden=matches.length<=6||Boolean(search.value.trim());
      rosterMore.textContent=expanded?'목록 접기':`인물 전체 보기 (${matches.length})`;
      rosterMore.setAttribute('aria-expanded',String(expanded));
      document.querySelector('#roster-empty').hidden=matches.length>0;
      panel.hidden=matches.length===0;
    }
    document.querySelector('#roster-tools').hidden=characters.length<=6;
    search.addEventListener('input',()=>{const matches=matchingCharacters();if(matches.length&&!matches.includes(selected))selectCharacter(matches[0],false);updateRoster();document.querySelector('#selection-status').textContent=`${matches.length}명의 인물을 찾았습니다.`;});
    rosterMore.addEventListener('click',()=>{expanded=!expanded;if(!expanded&&matchingCharacters().indexOf(selected)>=6)selectCharacter(matchingCharacters()[0],false);updateRoster();});
    function selectCharacter(index,announce = true) {
      selected = index;
      const character = characters[index];
      tabs.forEach((tab,i) => { tab.setAttribute('aria-selected',String(i===index)); tab.tabIndex = i===index ? 0 : -1; });
      panel.setAttribute('aria-labelledby',tabs[index].id);
      portrait.onerror = () => { portrait.onerror = null; portrait.removeAttribute('srcset'); portrait.src = placeholder(index); portrait.alt = `${character.name} 임시 이미지`; document.querySelector('#portrait-note').textContent = '이미지 준비 중'; };
      portrait.sizes = '(max-width: 900px) 280px, (max-width: 1100px) 36vw, 390px';
      portrait.srcset = character.imageSmall ? `${character.imageSmall} 540w, ${character.image} 1080w` : '';
      portrait.decoding = 'async';
      portrait.src = character.image || placeholder(index); portrait.alt = character.image ? `${character.name} 인물 이미지` : `${character.name} 임시 이미지`;
      portrait.style.objectPosition = character.imagePosition || 'center';
      document.querySelector('#portrait-label').textContent = `CHARACTER / ${twoDigits(index+1)}`;
      document.querySelector('#portrait-note').textContent = character.image ? character.name : '이미지 준비 중';
      document.querySelector('#detail-kicker').textContent = character.englishName || `CHARACTER ${twoDigits(index+1)}`;
      document.querySelector('#character-name').textContent = character.name;
      document.querySelector('#character-role').textContent = character.role;
      document.querySelector('#character-quote').textContent = character.quote || '';
      document.querySelector('#character-quote').hidden = !character.quote;
      document.querySelector('#character-bio').replaceChildren(...character.paragraphs.map(text => { const p = document.createElement('p'); p.textContent = text; return p; }));
      document.querySelector('#detail-count').textContent = `${twoDigits(index+1)} / ${twoDigits(characters.length)}`;
      document.querySelector('.next').hidden = characters.length < 2;
      updateRoster();
      panel.classList.remove('appearing'); void panel.offsetWidth; panel.classList.add('appearing');
      if(announce) document.querySelector('#selection-status').textContent = `${character.name} 소개가 표시되었습니다.`;
    }
    document.querySelector('.next').addEventListener('click',() => {
      const matches=matchingCharacters();
      selectCharacter(matches[(matches.indexOf(selected)+1)%matches.length]);
      panel.focus({preventScroll:true});
      panel.scrollIntoView({block:'start',behavior:'instant'});
    });
    selectCharacter(0,false);
  </script>
</body>
</html>
