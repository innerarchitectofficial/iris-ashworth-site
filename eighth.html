      <article class="episode-story" aria-label="제8화 본문">
<p>전날 홀리스가 했던 말이 자꾸만 떠올랐다.</p>
<p>‘사람보다 먼저 도착한 분류가 그 사람의 사실이 되는 곳도 있나 보군요.ʼ</p>
<p>아이리스는 그 말이 틀렸다는 근거를 찾으려 했다. 중앙의 기록이 북부를 잘못 판단한 것이 아니라는 증거, 편입이 그들을 위험에 빠뜨리는 일이 아니라 왕국의 보호 안으로 들이는 절차라는 증거.</p>
<p>그것을 확인하면 다음 회의에서는 다시 준비된 답을 말할 수 있을 것 같았다.</p>
<p>오전 내내 회의 자료와 왕실 서신이 이어졌다.</p>
<p>서기관에게 맡겨도 되는 일이었지만, 왕비는 후계자의 친필이 왕실의 온정을 증명한다고 말했다.</p>
<p>아이리스는 가능한 만큼 직접 답장을 썼다.</p>
<p>마지막 봉인을 찍을 때쯤에는 손목 안쪽이 미세하게 떨리고 있었다.</p>
<p>아무도 알아보지 못할 정도였다. 아이리스 자신만 제외하면,</p>
<p>예정된 일정을 모두 마친 오후, 그녀는 서쪽 기록보관소로 향했다.</p>
<p>문은 무거웠다. 손잡이에 힘을 주자 손목 안쪽이 다시 당겼다.</p>
<p>반대편 손으로 문을 밀어열자, 오래된 종이와 먼지 냄새가 흘러나왔다.</p>
<p>안쪽은 궁정의 다른 곳보다 서늘했다. 창문은 높고 작았으며, 빛은 서가 사이로 가늘게 잘려 들어왔다.</p>
<p>서쪽 기록보관소에는 거울이 없었다.</p>
<p>정확히는 한때 있었으나, 지금은 제 기능을 하지 못하는 것들뿐이었다.</p>
<p>긴 복도 양쪽에는 은막이 벗겨진 거울들이 천으로 덮여 있었고, 드러난 가장자리마다 검은 얼룩이 번져 있었다. 몇몇은 벽을 비추는 대신 빛을 흐리게 삼켰다.</p>
<p>기록관리부가 오래전 정식 보관소 목록에서 제외한 곳이었다.</p>
<p>원형 거울의 판정과 대조할 수 없는 장부는 정확성을 보장할 수 없다는 이유였다.</p>
<p>그 뒤로 이곳에는 왕국이 더는 필요로 하지 않는 기록들만 남았다.</p>
<p>사망일이 불분명한 사람들의 이름.</p>
<p>지도에서 사라진 마을.</p>
<p>왕실의 허가를 받지 못한 혼인.</p>
<p>중앙에 보고되지 않은 전투.</p>
<p>북부에 관한 오래된 장부들.</p>
<p>아이리스는 문 앞에 잠시 서 있었다.</p>
<p>아무도 없었다.</p>
<p>경비병도,</p>
<p>시녀도,</p>
<p>판정을 기록할 관리도.</p>
<p>아이리스는 자신도 모르게 숨을 깊이 들이마셨다.</p>
<p>곧 사파이어가 목 아래를 눌렀다.</p>
<p>그녀는 호흡을 줄였다.</p>
<p>손가락으로 목걸이의 가장자리를 만지려다가 멈췄다.</p>
<p>누군가 볼 수 있었다.</p>
<p>그 생각이 먼저 떠올랐다.</p>
<p>아이리스는 손을 내리지 못한 채 천으로 덮인 거울들을 바라보았다. 복도 끝까지 둘러보아도 제 얼굴을 비춰볼 만한 곳은 없었다.</p>
<p>그녀는 여전히 등을 곧게 펴고 있었다. 입술 끝에는 아무 의미도 없는 미소가 남아 있었다.</p>
<p>아이리스는 천천히 손을 내렸다.</p>
<p>북부 장부는 가장 안쪽 서고에 있었다.</p>
<p>정식 등록 이전의 영지 기록은 연도 대신 지역명으로 분류되어 있었다. 베인가에 관한 장부들은 ‘북부 방위령ʼ, ‘설원 변경ʼ, ‘왕국 외곽지ʼ라는 서로 다른 이름 아래 흩어져 있었다.</p>
<p>아이리스는 안내 목록을 따라 서가 사이를 걸었다.</p>
<p>낡은 장부 몇 권을 꺼내 탁자 위에 올렸다. 가죽 표지는 습기를 먹어 가장자리가 일어나 있었다. 손으로 먼지를 털어내자 희미한 문장이 드러났다.</p>
<p>북부 방어선 전사자 명부.<br>왕국력 삼백십이 년.</p>
<p>아이리스는 첫 장을 펼쳤다.</p>
<p>이름들이 빼곡했다. 몇몇 이름 옆에는 나이도, 출신도 적혀 있지 않았다.</p>
<p>사망한 장소만 짧게 기록되어 있었다.</p>
<p>서리 협곡.</p>
<p>검은 고개.</p>
<p>북서 감시탑.</p>
<p>중앙 기록이라면 허용되지 않을 불완전한 장부였다.</p>
<p>그런데도 아이리스는 한동안 페이지를 넘기지 못했다. 한 사람의 이름 아래에 다른 필체로 짧은 문장이 덧붙어 있었다.</p>
<p><strong>눈보라 속에서 세 아이를 데리고 돌아옴</strong>.</p>
<p>그 아래 이름에는 이렇게 적혀 있었다.</p>
<p><strong>마지막까지 문을 닫지 않음</strong>.</p>
<p>아이리스는 손끝으로 잉크가 번진 부분을 따라갔다.</p>
<p>“그 장부는 조심하시는 편이 좋겠습니다.”</p>
<p>등 뒤에서 목소리가 들렸다.</p>
<p>놀라 돌아서는 순간 손목이 탁자 모서리에 부딪혔다. 짧은 통증이 팔을 타고 올라왔다.</p>
<p>홀리스가 서가 사이에 서 있었다.</p>
<p>오늘은 제복 위에 긴 외투만 걸친 차림이었다.</p>
<p>목깃은 단정했지만 단추 하나가 풀려 있었고, 한 손에는 먼지가 묻은 종이 묶음을 들고 있었다.</p>
<p>그가 이곳에 있다는 사실보다, 아무런 기척도 느끼지 못했다는 사실이 아이리스를 더 당황하게 했다.</p>
<p>아이리스는 곧 표정을 바로잡았다.</p>
<p>“홀리스 경께서 이곳에는 무슨 일이지요?”</p>
<p>목소리는 정확했다.</p>
<p>“다음 회의를 준비하고 있었습니다.”</p>
<p>홀리스의 시선이 탁자에 부딪힌 손으로 내려갔다.</p>
<p>“아픈 것 같군요.”</p>
<p>“괜찮습니다.”</p>
<p>대답은 생각보다 먼저 나왔다. 입술 끝도 자연스럽게 올라갔다.</p>
<p><strong>익숙한 표정이었다</strong>.</p>
<p>‘염려하지 않으셔도 됩니다.ʼ</p>
<p>홀리스는 잠시 그녀를 바라보았다.</p>
<p>그 시선이 너무 오래 머물러 아이리스는 자신의 미소가 어긋났는지 확인하고 싶어졌지만, 이곳에는 볼 수 있는 거울이 없었다.</p>
<p>홀리스가 아주 작게 숨을 내쉬었다. 한숨인지 웃음인지 분명하지 않았다.</p>
<p>“위를 한 번 보시겠습니까?”</p>
<p>아이리스는 움직이지 않았다.</p>
<p>홀리스가 시선으로 천장을 가리키자, 그녀는 마지못해 고개를 들었다.</p>
<p>검게 그을린 돌 천장과 낡은 들보가 보였다.</p>
<p>그뿐이었다.</p>
<p>“무엇을 보라는 건가요?”</p>
<p>“아무것도 없습니다.”</p>
<p>홀리스가 말했다.</p>
<p>“전하를 판정할 거울도, 그 표정을 기록할 관리도.”</p>
<p>아이리스의 입술 끝이 굳었다.</p>
<p>“그것이 무슨 상관이지요?”</p>
<p>“저도 그게 궁금했습니다.”</p>
<p>그는 조금 전보다 부드러운 목소리로 말했다.</p>
<p>“<strong>여기서도 회의장에서와 같은 얼굴을 하고 계시기에</strong>.”</p>
<p>아이리스의 손가락이 드레스 자락을 눌렀다.</p>
<p>“저는 언제나 같은 사람입니다.”</p>
<p>“그렇습니까?”</p>
<p>홀리스는 고개를 아주 조금 기울였다. 그 반응은 회의장에서와 같았다.</p>
<p>대답을 부정하지도,</p>
<p>그대로 받아들이지도 않는 태도.</p>
<p>아이리스는 그가 다음에 무엇을 말할지 기다렸다. 홀리스는 아무 말도 덧붙이지 않았다. 손에 들고 있던 종이 묶음을 옆 탁자에 내려놓았다.</p>
<p>그가 가까이 다가오자 아이리스는 본능적으로 한 걸음 물러났다.</p>
<p>사파이어가 흔들리며 붉어진 피부를 스쳤다. 호흡이 아주 짧게 끊어졌다.</p>
<p>홀리스의 시선이 그곳에 닿았다.</p>
<p>아이리스는 반사적으로 붉은 흔적을 손으로 가렸다.</p>
<p>“무례하군요.”</p>
<p>“그럴 의도는 없었습니다.”</p>
<p>홀리스는 시선을 거두었다. 변명하지도 않았고, 보지 못했다고 거짓말하지도 않았다. 그 점이 오히려 아이리스를 더 불편하게 했다.</p>
<p>“회의장에서도 보셨겠지요.”</p>
<p>아이리스가 말했다.</p>
<p>“무엇을 말씀하시는 겁니까?”</p>
<p>“목걸이를.”</p>
<p>그녀는 목소리를 낮추었다.</p>
<p>“어제도 그쪽을 보셨으니까요.”</p>
<p>홀리스는 잠시 대답하지 않았다.</p>
<p>“목걸이를 본 것은 아닙니다.”</p>
<p>“그렇다면요?”</p>
<p>“<strong>전하께서 그것을 견디는 방식을 보았습니다</strong>.”</p>
<figure><img src="images/ch8-art.png" width="1122" height="1402" alt="서쪽 기록보관소에서 만난 아이리스와 홀리스" loading="lazy" decoding="async"></figure>
<p>아이리스의 손이 목걸이 위에서 멈췄다.</p>
<p>보관소 안은 조용했다. 멀리서 낡은 들보가 한 번 삐걱거렸다.</p>
<p>아이리스는 다시 미소를 지으려 했다.</p>
<p>“그 표정은 조금 전에도 봤습니다.”</p>
<p>입술이 그대로 멈췄다.</p>
<p>“무슨 표정을 말하는 거지요?”</p>
<p>“괜찮다고 하실 때의 얼굴이요.”</p>
<p>“실제로 괜찮으니까요.”</p>
<p>“그렇다면 다행이고요.”</p>
<p>홀리스는 쉽게 물러났다.</p>
<p>그가 반박하지 않자 아이리스는 오히려 다음 말을 잃었다.</p>
<p>홀리스는 탁자 위에 놓인 장부로 시선을 옮겼다.</p>
<p>“그 기록을 찾으러 오셨습니까?”</p>
<p>“내일 회의를 준비하는 중입니다.”</p>
<p>“중앙이 이미 정리해둔 자료로도 충분할 텐데요.”</p>
<p>“확인하고 싶었습니다.”</p>
<p>“무엇을요?”</p>
<p>아이리스는 대답하지 못했다.</p>
<p>중앙의 기록이 옳다는 사실.</p>
<p>홀리스의 말이 틀렸다는 근거.</p>
<p>북부의 편입이 공정한 결정이라는 확신.</p>
<p>어느 것도 입 밖에 내면 정확하게 들리지 않을 것 같았다.</p>
<p>홀리스는 답을 재촉하지 않았다. 열린 장부 쪽으로 몸을 기울였다.</p>
<p>눈보라 속에서 세 아이를 데리고 돌아옴.</p>
<p>그 문장을 읽은 그의 얼굴에서 느긋함이 사라졌다.</p>
<p>“아는 사람인가요?”</p>
<p>아이리스가 물었다.</p>
<p>“아뇨. 제가 태어나기 전 기록입니다.”</p>
<p>그의 손가락이 이름 옆의 짧은 문장 위에 머물렀다.</p>
<p>“하지만 북부에서는 이런 기록을 없애지 않습니다.”</p>
<p>“중앙 기준으로는 불완전한 장부예요.”</p>
<p>“그렇겠지요.”</p>
<p>“출생지와 신뢰도, 혈통도 기록되어 있지 않으니까요.”</p>
<p>“대신 그 사람이 무엇을 했는지는 남아 있군요.”</p>
<p>아이리스는 장부를 바라보았다.</p>
<p>“공식적인 판단에는 사용할 수 없는 기록입니다.”</p>
<p>“<strong>누구를 판단하기 위해 남긴 기록이 아니니까요</strong>.”</p>
<p>홀리스가 말했다.</p>
<p>“<strong>잊지 않기 위해 남긴 겁니다</strong>.”</p>
<p>아이리스는 조금 전 읽은 이름으로 눈을 돌렸다.</p>
<p>그 차이를 생각해본 적이 없었다.</p>
<p>아이리스가 여태 장부에서 확인해온 것은 다른 것들이었다.</p>
<p>어떤 교육을 받을 수 있는지,</p>
<p>어떤 직책을 맡을 수 있는지,</p>
<p>누구와 혼인할 수 있는지.</p>
<p>살아 있는 사람의 자리를 미리 정하고, 그 자리에서 벗어나지 않도록 보호하기 위해 쓰였다.</p>
<p>눈보라 속에서 세 아이를 데리고 돌아왔다는 것.</p>
<p>마지막까지 문을 닫지 않았다는 것.</p>
<p>‘누구를 기다렸던 걸까.ʼ</p>
<p>아이리스가 페이지를 넘기려 손을 뻗었다. 손목이 다시 떨렸다. 이번에는 감출 틈이 없었다.</p>
<p>“아까 부딪힌 곳입니까?”</p>
<p>아이리스는 곧 손을 거두었다.</p>
<p>“서신을 좀 많이 써서 그런 것뿐입니다.”</p>
<p>홀리스는 잠시 그녀를 바라보았다.</p>
<p>“전하께서 모든 편지를 직접 다 쓰시는 모양입니다.”</p>
<p>“필요한 만큼 했습니다.”</p>
<p>“필요한 만큼.”</p>
<p>홀리스가 천천히 되풀이했다.</p>
<p>그 말의 빈틈을 살피는 듯했다.</p>
<p>아이리스는 불쾌해졌다.</p>
<p>“경께서는 다른 사람을 그렇게 세세히 살피는 것이 취미인가요?”</p>
<p>“아닙니다.”</p>
<p>“그런데 왜 계속 보는 거지요?”</p>
<p>홀리스는 곧바로 대답하지 않았다.</p>
<p>아이리스는 그가 또 모호한 말을 할 거라고 생각했다.</p>
<p>그러나 돌아온 답은 뜻밖에 단순했다.</p>
<p>“<strong>보이니까요</strong>.”</p>
<p>아이리스의 눈썹이 아주 조금 움직였다.</p>
<p>“궁정에서는 보이는 것이 곧 사실이 됩니다.”</p>
<p>아이리스가 말했다.</p>
<p>“그렇다면 보이지 않는 것은요?”</p>
<p>“사실이 아니었던 것이 되겠지요.”</p>
<p>홀리스의 시선이 그녀에게 머물렀다.</p>
<p>“전하께서 아픈 것도 그렇습니까?”</p>
<p>아이리스의 손가락이 드레스 자락을 눌렀다.</p>
<p>“그렇다고하면 무엇이 달라지죠?”</p>
<p>“아무것도요.”</p>
<p>아이리스는 그 말을 이해하지 못했다.</p>
<p>사람들은 언제나 그녀에게서 무언가가 달라지기를 원했다.</p>
<p>정확한 대답을 하면 의심이 사라져야 했고, 온화한 미소를 지으면 불편한 분위기가 가라앉아야 했다. 괜찮다는 말로 타인의 염려가 끝나야 했다.</p>
<p>“아무것도 달라지지 않는데 왜 묻습니까?”</p>
<p>“전하께서 대답하고 싶을 수도 있으니까요.”</p>
<p>“대답하고 싶지 않다면요?”</p>
<p>“<strong>그러면 대답하지 않으셔도 됩니다</strong>.”</p>
<p>홀리스는 정말 그것으로 충분하다는 얼굴이었다.</p>
<p>아이리스는 그를 바라보았다. 그 말이 이상하게 무례하게 느껴졌다.</p>
<p><strong>대답해야 한다는 전제를 너무 쉽게 없애버린 탓이었다</strong>.</p>
<p>막상 아무 말도 하지 않고 있으니 숨을 쉬기가 조금 수월했다.</p>
<p>아이리스는 탁자 가장자리에 손을 올렸다. 손목에 힘을 주지 않자 떨림이 조금 잦아들었다.</p>
<p>홀리스는 그것을 보고도 더는 언급하지 않았다.</p>
<p>그는 맞은편에 놓인 의자를 끌어 앉았다.</p>
<p>왕녀보다 먼저 자리에 앉는 것은 예법에 어긋났다.</p>
<p>아이리스는 그 사실을 지적하려다가 멈췄다.</p>
<p>홀리스는 장부 한 권을 펼쳐 들었다.</p>
<p>“앉으시겠습니까?”</p>
<p>움직이지 않은 채 그를 내려다보았다.</p>
<p>“사절께서 먼저 앉은 뒤에 권하는 것이 베인가의 예법인가요?”</p>
<p>“아뇨.”</p>
<p>홀리스의 입가에 희미한 웃음이 나타났다.</p>
<p>“지금은 예법을 차리지 않았습니다.”</p>
<p>“그걸 자랑스럽게 말하는군요.”</p>
<p>“여기서는 굳이 필요하지 않은 것 같아서요.”</p>
<p>홀리스가 천으로 덮인 거울을 바라보았다.</p>
<p>“저것들이 다시 살아나면 일어나겠습니다.”</p>
<p>아이리스는 웃지 않았다.</p>
<p>적어도 웃지 않으려 했다.</p>
<p>입술 한쪽이 아주 조금 움직였다.</p>
<p>홀리스의 시선이 그곳에 닿았다.</p>
<p>아이리스는 곧 표정을 지웠다.</p>
<p>“<strong>보지 마세요</strong>.”</p>
