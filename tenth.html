      <article class="episode-story" aria-label="제10화 본문">
<p>이틀 뒤, 북부의 장부들이 대전으로 들어왔다.</p>
<p>처음에는 쇠를 덧댄 낡은 상자 하나였다.</p>
<p>짙은 나무로 만든 상자의 모서리는 깨져 있었고, 손잡이에는 오래된 가죽끈이 감겨 있었다.</p>
<p>북부의 서기관 두 사람이 그것을 회의석 옆에 내려놓았다.</p>
<p>곧 두 번째와 세 번째 상자가 그 뒤를 따랐다.</p>
<p>몇몇에는 베인가의 문장이 희미하게 남아 있었고, 몇몇에는 아무런 표식도 없었다. 뚜껑이 뒤틀린 채 밧줄로 묶인 것도 있었다.</p>
<p>마지막 상자가 놓였을 때에는 귀족들의 대화도 잦아들어 있었다.</p>
<p>아이리스는 왕의 왼편에 앉아 그 광경을 지켜보았다.</p>
<p>며칠 전 서쪽 기록보관소에서 펼쳤던 장부가 떠올랐다. 그곳에 남은 것은 왕국이 쓰지 않는 옛 기록들이었다. 오늘 들어온 상자에는 북부에서 지금도 쓰고 있는 장부들이 담겨 있었다.</p>
<p>홀리스는 사절단의 가장 앞에 서 있었다.</p>
<p>오늘의 제복은 완벽하게 단정했다. 목깃은 잠겨 있었고 소매에는 먼지 하나 묻어 있지 않았다.</p>
<p>이틀 전 낡은 의자에 기대어 이름 없는 짐승을 쓰다듬던 사람과는 전혀 달라 보였다.</p>
<p>에드먼드 왕이 상자들을 천천히 훑었다.</p>
<p>“이것이 전부인가?”</p>
<p>“일부입니다.”</p>
<p>재무대신이 상자 더미를 바라보았다.</p>
<p>“일부라고 했습니까?”</p>
<p>“이번 협상에 필요한 것부터 골랐습니다.”</p>
<p>기록관리부 수장 펜이 자리에서 일어났다.</p>
<p>“확인해도 되겠습니까?”</p>
<p>홀리스가 고개를 끄덕였다.</p>
<p>북부의 서기관이 가장 가까운 상자의 뚜껑을 열었다.</p>
<p>안에는 두꺼운 장부와 낱장의 문서, 천으로 감싼 작은 기록판들이 빽빽하게 들어 있었다.</p>
<p>펜이 가장 위의 장부를 꺼냈다.</p>
<p>가죽 표지에는 칼날로 긁은 듯한 글씨가 남아 있었다.</p>
<p>서리 협곡 동부 거주자 명부.</p>
<p>장부 안에는 여러 필체가 뒤섞여 있었다. 잉크로 적힌 이름 옆에 손도장이 찍혀 있었고, 본명 대신 국경에서 불리던 별명만 남은 사람도 있었다.</p>
<p>페이지 한쪽에는 갈색 얼룩이 말라붙어 있었다.</p>
<p>재무대신이 손수건으로 코끝을 가렸다.</p>
<p>“저런 것을 공식 기록이라고 부릅니까?”</p>
<p>“북부에서는 그렇게 불러왔습니다.”</p>
<p>홀리스가 말했다.</p>
<p>펜은 몇 장을 더 넘겼다.</p>
<p>“출생 연도와 혈통이 비어 있군요. 이다음 장은 같은 사람을 적은 듯 한데 이름이 다릅니다. 중앙 장부에 이대로 옮길 수는 없습니다.”</p>
<p>“그래서 가져왔습니다.”</p>
<p>펜이 고개를 들었다.</p>
<p>홀리스는 서기관에게서 장부 한 권을 받아 펼쳤다.</p>
<p>“이 사람은 중앙 장부에 사망한 것으로 적혀 있습니다.”</p>
<p>그가 한 이름을 가리켰다.</p>
<p>“하지만 지난달까지 북서 감시탑에서 근무했습니다.”</p>
<p>펜이 장부를 가까이 당겼다. 그 이름 옆에는 근무한 날짜와 교대한 병사의 이름이 나란히 적혀 있었다.</p>
<p>홀리스가 다음 장을 펼쳤다.</p>
<p>“이 사람에게는 이름이 셋입니다. 태어난 마을에서 받은 이름과 양부가 붙여준 이름, 국경에서 불린 이름이 모두 다릅니다.”</p>
<p>홀리스가 펜을 바라보았다.</p>
<p>“<strong>어느 이름을 진짜라고 기록하시겠습니까</strong>?”</p>
<figure><img src="images/ch10-art.png" width="1122" height="1402" alt="왕실 대전에서 북부의 장부를 대조하는 회의" loading="lazy" decoding="async"></figure>
<p>“우선 세 이름이 한 사람의 것인지부터 확인해야겠지요.”</p>
<p>“저도 그렇게 생각합니다.”</p>
<p>홀리스는 이번에는 장부를 덮지 않았다.</p>
<p>“그러려면 이 장부도 펴놓고 보셔야 합니다. 중앙의 명부만으로는 세 이름이 있다는 것조차 알 수 없으니까요.”</p>
<p>펜의 시선이 상자 더미로 향했다.</p>
<p>“모두 번역하고 대조하려면 상당한 시간이 필요합니다. 북부의 지명도, 가족 관계를 적는 방식도 중앙과 다릅니다. 어느 이름으로 기록해야 하는지 말해줄 사람이 이미 죽은 경우도 있겠지요.”</p>
<p>“그렇다고 그 사람이 살아서 쓰던 이름까지 틀렸다고 할 수는 없지 않습니까.”</p>
<p>홀리스가 반문했다.</p>
<p>아이리스의 왼편에 앉아 있던 커런이 몸을 조금 앞으로 기울였다.</p>
<p>지난 회의에는 참석하지 않았지만 이번 협상은 달랐다. 서로 다른 지방의 기록을 중앙의 체계에 맞추는 일은 노윅 가문이 오래 맡아온 영역이었다.</p>
<p>“우선 기록의 종류부터 나누어야 합니다.”</p>
<p>“거주와 방위, 혼인과 사망 기록을 나누고 같은 이름이 어디에 나오는지 표시하십시오. 방금 본 감시탑 장부처럼, 어느 한쪽에 빠진 사실이 다른 쪽에 남아 있을 수 있습니다.”</p>
<p>서기관이 지시를 받아 적었다. 커런은 펼쳐진 두 장부를 나란히 놓았다.</p>
<p>혼란은 그의 입을 거칠 때마다 순서가 되었다.</p>
<p>“중앙에서 인력을 붙이겠습니다. 대신 북부식 명칭과 관습을 아는 사람이 필요합니다. 마을 하나를 두고도 양쪽에서 부르는 이름이 다르니까요.”</p>
<p>“그 부분은 제가 돕겠습니다.”</p>
<p>홀리스가 말했다.</p>
<p>커런은 홀리스를 잠시 바라보다가 고개를 끄덕였다.</p>
<p>“그렇다면 중앙의 기준을 충족하는 사람부터 우선 등록하는 것은 어떻습니까?”</p>
<p>재무대신이 끼어들었다.</p>
<p>“확인이 어려운 사람들은 뒤로 미루고, 기록이 명확한 주민부터 왕국의 권리 안으로 들이는 겁니다.”</p>
<p>“그동안 나머지 사람들은 어떻게 됩니까?”</p>
<p>아이리스의 목소리가 대전 안에 울렸다.</p>
<p>재무대신이 그녀를 바라보았다.</p>
<p>“확인이 끝날 때까지는 중앙 장부에 이름을 올릴 수 없습니다, 전하.”</p>
<p>“<strong>중앙이 알아볼 수 있게 기록된 사람만 먼저 권리를 얻는다면</strong>, <strong>기록의 차이가 곧 사람의 차이</strong><strong>가 될 테니까요</strong>. <strong>그것을 공정한 절차라 하기는 어렵습니다</strong>.”</p>
<p>회의장이 조용해졌다.</p>
<p>틀린 말은 아니었다.</p>
<p>그러나 평소의 아이리스라면 먼저 기록의 정확성을 말했을 것이다. 모두가 수긍한 뒤에야 그 절차 밖에 남을 사람의 이야기를 꺼냈을 것이다.</p>
<p>이번에는 순서가 바뀌었다. 더구나 왕이 결론을 내리기도 전이었다.</p>
<p>커런이 아이리스를 바라보았다.</p>
<p>놀란 기색은 아주 짧았다.</p>
<p>“공주 전하의 우려는 충분히 이해할 수 있습니다.”</p>
<p>그의 목소리는 평온했다.</p>
<p>“다만 전하께서 말씀하신 문제는 부분 등록에서 발생할 행정적 불균형으로 정리하는 편이 더 정확할 듯합니다.”</p>
<p>아이리스가 커런을 바라보았다.</p>
<p>그는 이미 대신들을 향해 말을 잇고 있었다.</p>
<p>“한 가족 안에서 누구는 거주권을 인정받고 누구는 기다려야 합니다. 장부를 대조하기 전에 일부 주민부터 등록하는 것은 보류해야 합니다.”</p>
<p>재무대신의 눈길이 펼쳐진 장부로 내려갔다.</p>
<p>“그런 의미라면 타당하군요.”</p>
<p>서기관들의 펜이 다시 움직였다.</p>
<p><strong>사람의 차이는 행정적 불균형이 되었다</strong>.</p>
<p>아이리스의 말 궁정이 받아들일 수 있는 뜻으로 고쳐졌다.</p>
<p>에드먼드가 입을 열었다.</p>
<p>“완전하지 않은 기록으로 완전한 판정을 내릴 수는 없겠지.”</p>
<p>“북부 주민의 등록은 두 장부를 대조할 기준이 마련될 때까지 보류하고, 그동안 북부의 재판권과 병력 운용권은 지금대로 둔다. 이것이 편입 자체를 거부할 권리를 인정한다는 뜻은 아니네.”</p>
<p>“알고 있습니다.”</p>
<p>홀리스가 말했다.</p>
<p>“기록관리부는 북부의 서기관들과 함께 장부를 대조하도록 하라.”</p>
<p>에드먼드의 시선이 홀리스에게 머물렀다.</p>
<p>“베인가의 후계자는 우선 궁정에 남아 북부의 기록과 관습을 확인하고, 북부의 사정으로 자리를 비워야 할 때에는 왕실에 미리 알리도록.”</p>
<p>홀리스는 잠시 왕을 바라보았다.</p>
<p>“합당한 조건입니다.”</p>
<p>그가 몸을 숙였다.</p>
<p>아이리스는 무릎 위에 놓인 손을 내려다보았다.</p>
<p>손가락이 아주 조금 움직였다.</p>
<p><strong>그가 남는다는 사실이 무엇을 의미하는지는 생각하지 않았다</strong>.</p>
<p>왕이 떠난 뒤 대전은 잠시 작업장으로 변했다.</p>
<p>상자마다 번호가 붙고, 장부는 거주와 혼인, 사망과 방위 기록으로 나뉘었다. 상자가 열릴 때마다 먼지와 오래된 가죽 냄새가 피어올랐다.</p>
<p>아이리스는 자리에 남아 분류표를 살폈다.</p>
<p>이름을 읽을 수 없는 사람.</p>
<p>출생지가 남아 있지 않은 사람.</p>
<p>중앙의 기록과 생사가 일치하지 않는 사람.</p>
<p>그들은 모두 하나의 항목 아래 놓였다.</p>
<p>‘<strong>미확인</strong>.ʼ</p>
<p>아이리스는 장부에 반복되는 그 단어를 바라보았다.</p>
<p>누군가의 삶이 한 단어 아래 차곡차곡 쌓였다.</p>
<p>서기관 하나가 장부를 들고 다가왔다.</p>
<p>“전하, 이 주민은 이름도 거처도 분명한데 출생지가 없습니다. 임시 항목에 넣을까요?”</p>
<p>아이리스가 장부를 내려다보았다. 이름도 있었고 사는 곳도 있었다. 모르는 것은 그 사람이 어디서 태어났느냐는 것 뿐이었다.</p>
<p>“북부의 다른 기록과 먼저 대조하세요.”</p>
<p>“그동안에는 어떻게 표시합니까?”</p>
<p>서기관의 펜촉이 이름 곁에서 기다렸다.</p>
<p>“미확인으로 두세요.”</p>
<p>서기관이 그 말을 받아 적었다.</p>
<p>방금 전까지 낯설게 느껴지던 단어가 아이리스의 입을 거쳐 다시 장부 위에 놓였다.</p>
<p>해가 기울 무렵에야 첫 번째 분류표가 완성되었다. 커런은 목록을 확인한 뒤 아이리스에게 내밀었다.</p>
<p>“내일부터 기록관리부와 베인가의 서기관들이 대조를 시작할 겁니다. 전하께서는 판단이 필요한 사안만 최종적으로 확인하시는 편이 어떻겠습니까?”</p>
<p>“저도 기록을 직접 보면 더 정확하게…”</p>
<p>“세부 대조는 기록관리부가 맡는 것이 좋을 듯합니다.”</p>
<p>말투는 평온했다. 목록에는 아이리스가 맡을 일과 맡지 않을 일이 이미 구분되어 있었다. 질문은 그 구분에 동의하는지 확인하기 위한 것이었다.</p>
<p>“그렇게 해요.”</p>
<p>“현명한 판단입니다.”</p>
<p>커런은 목록을 넘겼다. 아이리스가 분류표에서 손을 거두는 순간 손목 안쪽이 다시 당겼다. 그녀는 반대편 손으로 손목을 잠시 감쌌다.</p>
<p>커런은 이미 다음 서기관을 불러 작업 순서를 설명하고 있었다.</p>
<p>대전 건너편에서는 홀리스가 북부의 기록판 몇 개를 상자 안으로 옮기고 있었다.</p>
<p>그가 고개를 들었다.</p>
<p>두 사람의 시선이 잠시 맞닿았다.</p>
<p>아이리스는 자신도 모르게 손을 목록 위에 올렸다.</p>
<p>그 거리에선 커런과 주고받은 말이 들렸을까. 홀리스의 얼굴만으로는 알 수 없었다.</p>
<p>아이리스는 먼저 눈을 돌렸다.</p>
<p>대전의 작업은 아직 끝나지 않았다.</p>
<p>그녀는 자리에서 일어나 대전을 나섰다.</p>
<p>문이 닫힌 뒤에도 인영원의 서기 하나가 분류표 앞에 남아 있었다. 그는 ‘미확인ʼ 아래에 놓인 이름들을 얇은 종이에 한 줄씩 옮겨 적었다.</p>
<p>그 종이의 머리에는 다른 말이 쓰여 있었다.</p>
<p>낙인 후보.</p>
<p>*</p>
<p>그날 밤 아이리스는 좀처럼 잠들지 못했다.</p>
<p>브리나는 잠옷을 갈아입히고 목걸이를 풀어 화장대 위에 놓은 뒤 물러났다.</p>
<p>촛불은 이미 꺼졌고 창문 사이로 옅은 달빛만 들어왔다. 사파이어는 더 이상 아이리스의 몸에 닿아 있지 않았다.</p>
<p>그런데도 압박감은 사라지지 않았다.</p>
<p>아이리스는 한동안 화장대 앞에 앉아 있었다.</p>
<p>서랍 안에는 늘 쓰던 공책이 있었다. 아이리스는 손을 뻗었다가 멈췄다.</p>
<p>오늘은 쓸 것이 많았지만, 무엇부터 적어야 할지 알 수 없었다. 결국 서랍을 열지 않은 채 침대로 돌아갔다.</p>
<p>눈을 감자, 낮에 보았던 이름들이 자꾸 떠올랐다.</p>
<p>사망한 것으로 기록된 사람.</p>
<p>세 개의 이름을 가진 사람.</p>
<p>출생지가 남아 있지 않은 사람.</p>
<p>‘<strong>미확인</strong>.ʼ</p>
<p>서기관의 글씨로 적힌 말인데, 눈을 감으니 자신의 목소리로 들렸다.</p>
<p>커런의 말은 틀리지 않았다.</p>
<p>장부를 대조하는 일은 사람을 빠뜨리지 않기 위해 필요한 절차였다.</p>
<p>커런은 언제나 이런 일에 정확했다.</p>
<p>사람이 살아갈 자리와 맡아야 할 몫을 정하고, 그 자리에서 벗어나지 않도록 보호하기 위해 순서를 만들었다.</p>
<p>커런이 마련한 미래에는 위험한 빈틈이 없어 보였다. 아이리스는 그런 그를 믿어왔다.</p>
<p>다만 낮에 끝내지 못한 말 한마디가 남아 있었다.</p>
<p>‘저도 직접 기록을 보면.ʼ</p>
<p>아이리스는 몸을 뒤척였다.</p>
<p>그녀는 손끝으로 목 아래를 만졌다. 아무것도 놓여 있지 않은데도 피부는 아직 무언가를 기억하고 있었다.</p>
<p>몸을 일으켜 침대 아래로 발을 내렸다. 차가운 바닥이 닿았다.</p>
<p>손목도 여전히 조금 아팠다.</p>
<p>아이리스는 얇은 겉옷을 걸치고 장갑을 꼈다.</p>
<p>시녀를 부르지 않았다.</p>
<p>이름 없는 작은 짐승이 떠올랐다.</p>
<p>아이리스는 그것을 찾으러 가는 것이 아니라고 생각했다.</p>
<p>다만 방 안에 누워 있는 것보다,</p>
<p>우연히 마주칠 수 있는 곳을 걷는 편이 나을 것 같았다.</p>
<p><strong>아이리스는 방을 나섰다</strong>.</p>
<p>짐승을 몇 번 마주친 오래된 회랑에 이르러, 그녀는 걸음을 멈췄다.</p>
<p><strong>늘 닫혀 있던 회랑 끝의 문이 오늘은 조금 열려 있었다</strong>.</p>
